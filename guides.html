      <button onclick="filterGuides('finance')" class="guide-filter-btn px-4 py-2 rounded-full text-xs sm:text-sm font-bold bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 transition">금융/목돈</button>
      <button onclick="filterGuides('tax')" class="guide-filter-btn px-4 py-2 rounded-full text-xs sm:text-sm font-bold bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 transition">세금/환급</button>
      <button onclick="filterGuides('job')" class="guide-filter-btn px-4 py-2 rounded-full text-xs sm:text-sm font-bold bg-white text-slate-600 hover:bg-slate-100 border border-slate-200 transition">고용/실업</button>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    function filterGuides(cat) {
      document.querySelectorAll('.guide-filter-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200');
      });
      event.target.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200');
      event.target.classList.add('bg-blue-600', 'text-white');

      const target = document.getElementById("guides-grid-target");
      if (cat === 'all') {
        renderGuideCards(MONEYPASS_DATA.guides, target);
      } else {
        const filtered = MONEYPASS_DATA.guides.filter(g => g.category === cat);
        renderGuideCards(filtered, target);
      }
    }
  </script>
